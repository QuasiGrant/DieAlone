    <text x="498" y="432" font-size="11" font-weight="bold">KEEPER'S CAMP</text>
    <text x="498" y="445" font-size="9">knoll 8 m, stove, report desk</text>

    <text x="545" y="660" font-size="12" font-weight="bold">LAKE</text>
    <text x="545" y="674" font-size="9">pump on the dock (Water)</text>
    <text x="545" y="686" font-size="9">resident: boathouse on stilts</text>

    <text x="765" y="215" font-size="12" font-weight="bold">CAMP 1, big</text>
    <text x="765" y="229" font-size="9">60 m, dense, warm yellow lights</text>
    <text x="765" y="241" font-size="9">cookfire meal (Food, some days)</text>

    <text x="826" y="542" text-anchor="start" font-size="12" font-weight="bold">CAMP 2, tiny</text>
    <text x="826" y="555" text-anchor="start" font-size="9">tent on a 12 m rock stack</text>
    <text x="826" y="567" text-anchor="start" font-size="9">cold white lamp, rain barrel</text>

    <text x="218" y="438" text-anchor="end" font-size="12" font-weight="bold">CAMP 3, sunken</text>
    <text x="218" y="451" text-anchor="end" font-size="9">hollow -4 m, green light</text>
    <text x="218" y="463" text-anchor="end" font-size="9">sit at the fire (Warmth)</text>

    <text x="150" y="128" font-size="11" font-weight="bold">WARD LEDGE</text>
    <text x="150" y="140" font-size="9">36 m, night only, stats screen</text>

    <text x="190" y="790" font-size="11" font-weight="bold">CULTIST CAVE</text>
    <text x="190" y="802" font-size="9">ravine -6 m, the cold place, not checked</text>
