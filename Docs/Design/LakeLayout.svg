<rect x="0" y="0" width="680" height="545" fill="#fff"/>
<text x="8" y="12" class="h">LakeLayout.svg, DRAFT 2, 2026-10-02, Sable (PLAN 8.23). A: boathouse, step and shallows 1:50. B: lake 1:500. C: section at x 240, 1:50. LakeLayout.md wins for numbers.</text>
<text x="8" y="19" class="t">World metres. Orange = interaction point. Pink = event point. Red solid = new wade box (stake line). Red dashed = wade ring as built. Brown dashed = skirt. Dotted outline = no collider. Red X = remove. Tan = dry bank.</text>

