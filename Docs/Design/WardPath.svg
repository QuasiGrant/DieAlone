<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="920" viewBox="0 0 1340 920" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="fireW" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e2552a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f3a54a" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#5A2412"/>
      <stop offset="0.45" stop-color="#2a120a"/>
      <stop offset="1" stop-color="#05080D"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#FFE8C0"/>
      <stop offset="0.4" stop-color="#FF8A2A"/>
      <stop offset="1" stop-color="#B8481C" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sheet" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#8a3a18"/>
      <stop offset="0.5" stop-color="#4a2416"/>
      <stop offset="1" stop-color="#1a0e0a" stop-opacity="0.3"/>
    </linearGradient>
    <pattern id="locked" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#bdb6aa"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#8a8272" stroke-width="2"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b01e1e"/></marker>
    <marker id="arrK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0601a"/></marker>
  </defs>

  <rect x="0" y="0" width="1340" height="920" fill="#f6f3ec"/>
  <text x="60" y="30" font-size="16" font-weight="bold" fill="#222">WardPath. DRAFT 2, 2026-10-01, Sable. The Ward walk and ledge (numbers: WardPath.md).</text>
  <text x="60" y="50" font-size="11" fill="#444">Left: plan, 5 px per m, north up, ground heights in m. Right: Shot A at eye level, Shot B in section. Red = the walk. Grey dashes = the old loop, closed by the fallen giant.</text>

  <!-- ===================== PLAN ===================== -->
  <rect x="60" y="80" width="650" height="725" fill="#dfe4cc" stroke="#999"/>
  <rect x="60" y="80" width="40" height="725" fill="url(#fireW)"/>
  <text transform="translate(78,440) rotate(-90)" text-anchor="middle" font-size="11" font-weight="bold" fill="#5a1606">west face falls to -40; the burning valley and far front beyond</text>
  <!-- ledge -->
  <rect x="110" y="355" width="80" height="350" fill="#cbbfa6" stroke="#8a7a62"/>
  <text x="114" y="372" font-size="10" fill="#333">LEDGE 62</text>
  <line x1="110" y1="355" x2="110" y2="535" stroke="#5a4a38" stroke-width="4"/>
  <line x1="110" y1="565" x2="110" y2="705" stroke="#5a4a38" stroke-width="4"/>
  <!-- prow -->
  <polygon points="110,533 100,537 100,563 110,567" fill="#a89a80" stroke="#5a4a38"/>
  <line x1="100" y1="537" x2="100" y2="563" stroke="#7a3a10" stroke-width="3"/>
  <!-- locked crest band -->
  <rect x="190" y="80" width="70" height="725" fill="url(#locked)" opacity="0.85"/>
  <rect x="200" y="555" width="60" height="225" fill="#8f877a" stroke="#555"/>
  <text x="206" y="672" font-size="11" font-weight="bold" fill="#fff">KNOB</text>
  <text x="212" y="686" font-size="11" font-weight="bold" fill="#fff">84</text>
  <text transform="translate(232,260) rotate(-90)" text-anchor="middle" font-size="10" fill="#222">CREST 80 to 86: terrain unchanged (F-1, W-1)</text>
  <rect x="104" y="350" width="92" height="6" fill="#6e6660"/>
  <rect x="104" y="702" width="100" height="6" fill="#6e6660"/>
  <!-- W foot band and IW2 -->
  <polyline points="560,280 560,650 590,650 590,707.5" fill="none" stroke="#6e6660" stroke-width="6"/>
  <polyline points="560,805 560,780 590,780 590,722.5" fill="none" stroke="#6e6660" stroke-width="6"/>
  <line x1="590" y1="707.5" x2="590" y2="722.5" stroke="#b01e1e" stroke-width="2" stroke-dasharray="2,2"/>
  <text x="596" y="702" font-size="9" fill="#333">IW2 + chain (day)</text>

  <!-- bench and face -->
  <rect x="350" y="380" width="90" height="180" fill="#d8ccae" stroke="#a8987a" stroke-dasharray="3,3"/>
  <text x="372" y="398" font-size="9" fill="#6a5a3a">bench 35 to 41</text>
  <rect x="305" y="380" width="45" height="200" fill="#b8ab92" opacity="0.7"/>
  <text transform="translate(316,600) rotate(-90)" font-size="9" fill="#333">face 60 deg, x 29 to 41</text>

  <!-- old route beyond the giant -->
  <polyline points="440,420 445,400 380,390 330,280 290,260 310,360 296,420" fill="none" stroke="#888" stroke-width="3" stroke-dasharray="7,5"/>
  <text x="346" y="250" font-size="10" fill="#666">old shelf, P2, cwm, leg 4: closed, unreachable</text>
  <circle cx="379" cy="385" r="5" fill="none" stroke="#888" stroke-width="2"/><text x="388" y="372" font-size="9" fill="#666">P2 trap</text>

  <!-- fallen giant z 272 -->
  <line x1="270" y1="420" x2="455" y2="420" stroke="#5a3a1e" stroke-width="9" stroke-linecap="round"/>
  <circle cx="272" cy="420" r="10" fill="#5a3a1e"/>
  <text x="462" y="416" font-size="10" font-weight="bold" fill="#5a3a1e">FALLEN GIANT z 272</text>
  <text x="462" y="429" font-size="9" fill="#5a3a1e">crest face to the east drop, 1.3 m, continuous</text>

  <!-- draw banks and firs -->
  <path d="M590,700 L420,686 L420,678 L590,690 Z" fill="#a9b88a"/>
  <path d="M590,728 L420,714 L420,724 L590,738 Z" fill="#a9b88a"/>
  <g fill="#3f5a2e" opacity="0.85">
    <circle cx="575" cy="690" r="7"/><circle cx="548" cy="688" r="7"/><circle cx="522" cy="686" r="7"/><circle cx="496" cy="684" r="7"/><circle cx="470" cy="682" r="7"/><circle cx="446" cy="680" r="7"/>
    <circle cx="560" cy="738" r="7"/><circle cx="534" cy="736" r="7"/><circle cx="506" cy="733" r="7"/><circle cx="480" cy="730" r="7"/><circle cx="452" cy="726" r="7"/><circle cx="430" cy="724" r="7"/>
    <circle cx="352" cy="500" r="5"/><circle cx="346" cy="520" r="5"/><circle cx="330" cy="505" r="5"/><circle cx="326" cy="525" r="5"/>
  </g>
  <path d="M588,722 Q520,724 430,708" fill="none" stroke="#9a9488" stroke-width="3" stroke-dasharray="2,3"/>
  <circle cx="600" cy="745" r="11" fill="#2c3f20"/>

  <!-- the walk -->
  <polyline points="680,750 590,715 510,715 420,700 435,560 365,550 335,470 322.5,545 305,470 287.5,470 280,470 250,470 232.5,452.5 180,452.5 180,493.5 100,550" fill="none" stroke="#b01e1e" stroke-width="4" stroke-linejoin="round"/>
  <!-- lookout -->
  <rect x="295" y="460" width="20" height="30" fill="none" stroke="#7a3a10" stroke-width="2"/>
  <!-- lanterns -->
  <g fill="#f3a54a" stroke="#7a3a10"><circle cx="365" cy="550" r="4"/><circle cx="335" cy="470" r="4"/><circle cx="322.5" cy="545" r="4"/></g>
  <!-- fin -->
  <polygon points="170,462 196,462 196,486 186,486" fill="#6e6660"/>
  <text x="150" y="447" font-size="9" fill="#222">cleft</text>
  <!-- stones -->
  <rect x="131" y="640" width="18" height="20" fill="#222"/>
  <rect x="156" y="655" width="18" height="20" fill="#222"/>
  <rect x="116" y="665" width="18" height="20" fill="#222"/>
  <text x="140" y="700" font-size="10" font-weight="bold" fill="#222">STONES</text>

  <!-- Shot A -->
  <polygon points="180,493.5 182,613.5 60,491.5" fill="#f3a54a" fill-opacity="0.22" stroke="#c0601a" stroke-dasharray="3,3"/>
  <line x1="180" y1="493.5" x2="137.6" y2="535.9" stroke="#c0601a" stroke-width="2.5" marker-end="url(#arrO)"/>
  <line x1="180" y1="493.5" x2="106" y2="588" stroke="#e2552a" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="112" y="602" font-size="8" fill="#a03010">far front starts here (218)</text>
  <circle cx="180" cy="493.5" r="5" fill="#c0601a"/>
  <text x="196" y="508" font-size="11" font-weight="bold" fill="#c0601a">A</text>
  <circle cx="102" cy="550" r="4" fill="#7a1e08"/>
  <text x="116" y="530" font-size="11" font-weight="bold" fill="#7a1e08">B prow</text>

  <!-- W-1 -->
  <line x1="565" y1="805" x2="165" y2="665" stroke="#2a5aa5" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="380" y="790" font-size="10" fill="#2a5aa5">deck to stones: the knob blocks it (W-1)</text>

  <!-- labels -->
  <g font-size="10" fill="#111">
    <circle cx="680" cy="750" r="5" fill="#111"/><text x="636" y="772">J 10, cairn lamp</text>
    <text x="596" y="730" font-weight="bold">GATE 12</text>
    <text x="456" y="762" font-weight="bold" fill="#2c4a1c">1 THE DRAW: banks 3 to 5 m, firs, dry bed</text>
    <circle cx="420" cy="700" r="4" fill="#2a5aa5"/><text x="350" y="716">P1 30, seep + cup</text>
    <text x="446" y="620" font-weight="bold">2 THE SHELF</text>
    <rect x="432" y="557" width="6" height="6" fill="#222"/><text x="444" y="566">rune post 82, turn W</text>
    <text x="370" y="575">stair foot 39</text>
    <text x="342" y="466">L1 44</text>
    <text x="250" y="560">L2 49, hide under flight 3</text>
    <text x="462" y="490" font-weight="bold">3 THE STAIR, cut into the face</text>
    <text x="462" y="503">flights N, S, N; on ground or posts 1.5 m or less</text>
    <text x="462" y="516">a fall lands on the open bench, south of the giant</text>
    <text x="276" y="448" font-weight="bold">4 LOOKOUT 60</text>
    <text x="120" y="400" font-weight="bold">5 THE LEDGE</text>
  </g>

  <g transform="translate(675,110)"><line x1="0" y1="30" x2="0" y2="0" stroke="#222" stroke-width="2" marker-end="url(#arrK)"/><text x="-4" y="44" font-size="11">N</text></g>
  <line x1="590" y1="795" x2="690" y2="795" stroke="#222" stroke-width="2"/>
  <text x="620" y="789" font-size="10">20 m</text>

  <!-- ===================== SHOT A ===================== -->
  <text x="760" y="74" font-size="13" font-weight="bold" fill="#222">Shot A: round the fin, night one, heading 225, level</text>
  <rect x="760" y="80" width="540" height="360" fill="url(#sky)" stroke="#333"/>
  <!-- low lit sheet streaming west over the front (night one) -->
  <path d="M989,236 C1060,214 1150,200 1300,186 L1300,232 C1180,240 1080,246 989,250 Z" fill="url(#sheet)" opacity="0.9"/>
  <!-- S end wall, black, left of the front -->
  <path d="M760,242 L800,240 L850,244 L900,241 L960,246 L989,250 L989,275 L760,275 Z" fill="#070504"/>
  <!-- far ridge and far front, right 58 percent only -->
  <path d="M989,262 L1060,256 L1140,252 L1220,256 L1300,252 L1300,272 L989,272 Z" fill="#120806"/>
  <path d="M989,262 L1000,240 L1012,256 L1026,228 L1040,252 L1056,222 L1070,250 L1086,214 L1100,246 L1118,224 L1132,250 L1150,210 L1166,244 L1182,220 L1198,248 L1214,212 L1230,242 L1246,222 L1262,250 L1278,216 L1300,240 L1300,262 Z" fill="url(#flame)"/>
  <line x1="760" y1="260" x2="1300" y2="260" stroke="#ffd59a" stroke-width="0.6" stroke-dasharray="3,6" opacity="0.6"/>
  <line x1="989" y1="90" x2="989" y2="270" stroke="#ffd59a" stroke-width="0.6" stroke-dasharray="2,4" opacity="0.5"/>
  <!-- ledge foreground; the lip hides the valley floor -->
  <path d="M760,300 C820,286 900,280 980,276 C1080,272 1180,272 1300,270 L1300,440 L760,440 Z" fill="#0d0907"/>
  <path d="M1080,440 C1000,380 900,320 850,288" fill="none" stroke="#2a201a" stroke-width="16" stroke-linecap="round"/>
  <g fill="#3a3220"><circle cx="900" cy="360" r="3"/><circle cx="960" cy="330" r="2"/><circle cx="1120" cy="350" r="3"/><circle cx="1180" cy="400" r="2"/><circle cx="820" cy="400" r="3"/></g>
  <!-- stunted firs at the lip -->
  <path d="M1238,272 L1248,210 L1256,272 Z M1232,250 L1262,250 L1247,226 Z" fill="#050403"/>
  <path d="M1272,268 L1284,190 L1294,268 Z M1266,238 L1300,236 L1283,206 Z" fill="#050403"/>
  <!-- stones in the left fifth, against the S wall and glow -->
  <rect x="778" y="198" width="34" height="84" fill="#020202"/>
  <rect x="830" y="194" width="38" height="88" fill="#020202"/>
  <rect x="862" y="206" width="30" height="74" fill="#020202"/>
  <g fill="#B8481C">
    <rect x="791" y="220" width="6" height="3"/><rect x="793" y="236" width="3" height="7"/><rect x="790" y="252" width="7" height="3"/>
    <rect x="845" y="216" width="3" height="8"/><rect x="842" y="232" width="8" height="3"/><rect x="846" y="250" width="3" height="7"/>
    <rect x="873" y="226" width="7" height="3"/><rect x="875" y="242" width="3" height="7"/>
  </g>
  <g font-size="10" fill="#ffe8c0">
    <text x="772" y="182">STONES 32 to 38 m, left fifth</text>
    <text x="772" y="128">against the S end wall and the glow,</text>
    <text x="772" y="141">not against flame</text>
    <text x="995" y="110">far front: bearings 218 to 271, right 58 percent</text>
    <text x="1010" y="180">low lit smoke sheet streaming west (night one)</text>
    <text x="780" y="330">ledge: rubble, stones in cracks, moss</text>
    <text x="1060" y="320">the lip hides the valley floor; Shot B shows it</text>
  </g>

  <!-- ===================== SHOT B SECTION ===================== -->
  <text x="760" y="478" font-size="13" font-weight="bold" fill="#222">Shot B: the prow, in section (west to the left)</text>
  <rect x="760" y="486" width="540" height="200" fill="#1a0e0a" stroke="#333"/>
  <path d="M1000,560 L1300,560 L1300,686 L1004,686 L998,620 Z" fill="#3a3028"/>
  <line x1="1000" y1="530" x2="1000" y2="560" stroke="#a0784a" stroke-width="4"/>
  <line x1="994" y1="530" x2="1010" y2="530" stroke="#a0784a" stroke-width="3"/>
  <circle cx="1013.5" cy="512" r="4" fill="#ffe8c0"/>
  <line x1="1013.5" y1="512" x2="788" y2="617" stroke="#ffb060" stroke-width="1.5"/>
  <line x1="1013.5" y1="512" x2="840" y2="686" stroke="#ffb060" stroke-width="1.5"/>
  <path d="M770,686 L780,650 L792,672 L806,640 L820,676 L834,656 L846,686 Z" fill="url(#flame)"/>
  <g font-size="10" fill="#ffe8c0">
    <text x="1020" y="508">eye 1.6 m, 0.45 m from the edge</text>
    <text x="1020" y="530">rail: top bar 1.0 m, open below</text>
    <text x="1040" y="590">prow, 2 m past the lip, west face sheer</text>
    <text x="800" y="600">25 deg</text>
    <text x="880" y="650">45 deg</text>
    <text x="770" y="510">floor fires, bases 25 to 45 deg down, burn under you</text>
  </g>

  <!-- ===================== TEXT ===================== -->
  <g font-size="11" fill="#222">
    <text x="760" y="712" font-weight="bold">The walk, chainage from J (camp to the prow about 115 s at walk; ceiling 150 s)</text>
    <text x="760" y="730">0 Gate 0-20. 1 Draw 20-54. 2 Shelf and bench 54-97. 3 Stair 97-144. 4 Lookout and throat 144-179. 5 Ledge 179-199.</text>
    <text x="760" y="752" font-weight="bold">As WARD falls: the silence line walks down the hill</text>
    <text x="760" y="770">WARD 12 (night 1): baseline, insects cut at the dogleg. 9-11: still the dogleg.</text>
    <text x="760" y="788">6-8: at the lookout. 3-5: at the stair foot. 1-2: at the gate. The fire is heard lower each band.</text>
    <text x="760" y="814" fill="#444">Kept: crest terrain, knob, cleft, fin, stone positions. Out: draw bridge, ring walls, the old loop.</text>
    <text x="760" y="832" fill="#444">Edges: banks, trees, timber, one fallen giant. Every fall lands on open ground that leads back.</text>
  </g>
  <text x="1250" y="900" font-size="11" fill="#444">Sable</text>
</svg>
