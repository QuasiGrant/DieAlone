<text x="20" y="400" class="t">Threshold flush. Rugs and wall-mounted things carry no collider. The player spawns on the floor at the bunk edge, never on the mattress.</text>
<text x="20" y="405" class="t">Roof overhang 0.5 m or more (LookSlice). The porch and floor sit within 0.1 m of the ground (stepOffset 0.1).</text>

