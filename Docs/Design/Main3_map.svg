    <text x="392" y="660">W1, chant spot 2</text>
    <text x="700" y="382" text-anchor="end" font-weight="bold">Jg</text>
    <text x="926" y="388" text-anchor="end" font-weight="bold">gate</text>
    <text x="547" y="592">pump</text>
