    <line x1="600" y1="886" x2="640" y2="886" stroke="#c0282d" stroke-width="2" stroke-dasharray="6 4"/><text x="646" y="890">tower line blocked (Ward by the Tor, cave by the rim)</text>
    <rect x="600" y="900" width="40" height="12" fill="#dccfb8" stroke="#a08c6c"/><text x="646" y="910">spur high ground</text>
    <rect x="600" y="920" width="40" height="12" fill="#c3cad3" stroke="#6d7886"/><text x="646" y="930">cave ravine</text>
