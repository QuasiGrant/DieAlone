    <text x="1066" y="402" font-weight="bold">PARKING</text>
    <text x="1066" y="492" font-weight="bold">STORE</text>
    <text x="1066" y="504" font-size="9">Food, sure</text>
    <text x="1066" y="140" font-weight="bold">ROAD</text>
    <text x="1066" y="152" font-size="9">straight</text>
    <text x="1066" y="600" font-weight="bold">FRONT</text>
    <text x="1066" y="612" font-weight="bold">ZONE</text>
