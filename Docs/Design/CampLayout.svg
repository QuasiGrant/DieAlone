<text x="10" y="21" class="t">Cabin local metres: origin inside south-west corner = world (175, 165.75), X east, Z north. Orange = interaction point. Blue band = 1 m clear path. Green hatched = built burn hedge stops and rocks (Marlow). Dashed = overhead, beyond the cut, or clear zone.</text>

