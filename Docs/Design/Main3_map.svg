<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="1000" viewBox="0 0 1140 1000" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="fire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e2552a" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#f3a54a" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <!-- background and title -->
  <rect x="0" y="0" width="1140" height="1000" fill="#f6f3ec"/>
  <text x="60" y="28" font-size="16" font-weight="bold" fill="#222">Main3 map. DRAFT revision 3, 2026-09-28, Sable. Nothing here is decided.</text>
  <text x="60" y="47" font-size="11" fill="#444">400 x 300 m at 2.5 px per m. Origin south-west, x east, z north. Heights absolute. Walk times at 2.5 m/s. The loop is in DailyLoop.md.</text>

  <!-- map area -->
  <rect x="60" y="70" width="1000" height="750" fill="#e2ebd6" stroke="#8a9a7a" stroke-width="1"/>

  <!-- fire, west -->
  <rect x="0" y="70" width="60" height="750" fill="url(#fire)"/>
  <text transform="translate(26,445) rotate(-90)" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a1e08">FIRE: burning ridge 300 to 500 m WEST</text>
  <text transform="translate(44,445) rotate(-90)" text-anchor="middle" font-size="10" fill="#7a1e08">wind from the west, smoke and ash drift east</text>
  <rect x="60" y="70" width="25" height="750" fill="#d6c6b0"/>
  <line x1="85" y1="70" x2="85" y2="820" stroke="#4d3d2d" stroke-width="3"/>
  <text transform="translate(76,700) rotate(-90)" text-anchor="middle" font-size="9" fill="#5a4a3a">valley -40 m, cliff x 10</text>

  <!-- spur -->
  <polygon points="85,345 210,320 310,257 372,170 397,70 85,70" fill="#dccfb8" stroke="#a08c6c" stroke-width="1"/>
  <line x1="240" y1="290" x2="330" y2="110" stroke="#7a6446" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="96" y="88" font-size="11" font-weight="bold" fill="#6a5436">SPUR, high ground to 36 m</text>
  <text transform="translate(326,150) rotate(-63)" font-size="9" fill="#6a5436">crest 34 m</text>

  <!-- cave ravine -->
  <polygon points="110,770 260,757 297,695 245,670 235,665 135,682" fill="#c3cad3" stroke="#6d7886" stroke-width="1"/>
  <polyline points="135,682 235,665 245,670 297,695" fill="none" stroke="#3f4752" stroke-width="3"/>
  <text x="140" y="700" font-size="9" fill="#3f4752">rim 14 m</text>

  <!-- front zone -->
  <rect x="930" y="70" width="130" height="750" fill="#e4e1db"/>
  <rect x="993" y="70" width="15" height="750" fill="#a29d94"/>
  <line x1="1000.5" y1="72" x2="1000.5" y2="818" stroke="#f2efe6" stroke-width="1" stroke-dasharray="10 10"/>
  <rect x="962" y="350" width="75" height="100" fill="#c2bdb3" stroke="#8c877e"/>
  <rect x="1000" y="295" width="30" height="20" fill="#7d8a93" stroke="#444"/>
  <line x1="1030" y1="300" x2="1030" y2="262" stroke="#333" stroke-width="2"/>
  <rect x="1000" y="482" width="20" height="15" fill="#b98a4a" stroke="#444"/>
  <line x1="930" y1="70" x2="930" y2="392" stroke="#555" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="930" y1="408" x2="930" y2="820" stroke="#555" stroke-width="2" stroke-dasharray="4 3"/>
  <rect x="988" y="72" width="25" height="4" fill="#c0282d"/>
  <rect x="988" y="814" width="25" height="4" fill="#c0282d"/>

  <!-- tower fire view -->
