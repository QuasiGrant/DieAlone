  <line x1="245" y1="670" x2="190" y2="735" stroke="#888" stroke-width="1.5" stroke-dasharray="2 4"/>
  <text transform="translate(385,350) rotate(33)" text-anchor="middle" font-size="9" fill="#c0282d" style="paint-order:stroke;stroke:#f6f3ec;stroke-width:3px">Ward hidden by the Tor, 6.4 m</text>
  <text transform="translate(360,540) rotate(-49.7)" text-anchor="middle" font-size="9" fill="#c0282d" style="paint-order:stroke;stroke:#f6f3ec;stroke-width:3px">cave hidden by the rim, 8.3 m</text>

