    <circle cx="515" cy="500" r="3.5"/><circle cx="619" cy="612" r="3.5"/><circle cx="742" cy="640" r="3.5"/><circle cx="870" cy="488" r="3.5"/>
    <circle cx="567" cy="393" r="3.5"/><circle cx="786" cy="380" r="3.5"/><circle cx="872" cy="411" r="3.5"/><circle cx="730" cy="304" r="3.5"/>
