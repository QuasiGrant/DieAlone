<svg xmlns="http://www.w3.org/2000/svg" width="680mm" height="600mm" viewBox="0 0 680 600" font-family="Arial, sans-serif">
<style>
 .t{font-size:3.2px;fill:#222}
 .s{font-size:2.6px;fill:#333}
