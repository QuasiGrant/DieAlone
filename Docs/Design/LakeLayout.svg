<!-- ============ notes ============ -->
<text x="10" y="426" class="h">Walks (2.5 m/s; Marlow's paper figures)</text>
<text x="10" y="433" class="t">Gangway foot to the step 9.4 m. Step to the slip stand 4.1 m. Step to the reeds stand 20 m by the trail, 12 m off the edge and up the beach.</text>
<text x="10" y="439" class="t">No step into deep water: slip and step side rails 1.05; rest collider 0.9 m or higher; the oar has no player collision.</text>
<text x="10" y="445" class="t">Gaps: crate 0.29 to the slip rail; barrel flush in the NE corner; west pocket 1.2; walkways 1.66; nothing in the 0.6 to 1.0 band.</text>
