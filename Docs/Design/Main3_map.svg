  <!-- tower -->
  <rect x="464" y="399" width="12" height="12" fill="#2c2c2c"/>
  <text x="458" y="395" text-anchor="end" font-size="10" font-weight="bold" fill="#222" style="paint-order:stroke;stroke:#f6f3ec;stroke-width:3px">TOWER, deck 56 m, eye 57.6 m</text>

