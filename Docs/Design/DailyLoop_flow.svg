<svg xmlns="http://www.w3.org/2000/svg" width="960" height="820" viewBox="0 0 960 820" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="820" fill="#f6f3ec"/>
  <text x="60" y="30" font-size="16" font-weight="bold" fill="#222">Daily loop. DRAFT revision 6, 2026-09-29, Sable. Nothing here is decided.</text>
  <text x="60" y="50" font-size="11" fill="#444">One wake-up is one day. Numbers provisional. Full rules in DailyLoop.md.</text>

  <text x="230" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#b5733a">DAY (sunset, sun fixed)</text>
  <text x="730" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f3440">NIGHT (dark, fire glow)</text>

  <!-- day boxes -->
  <g fill="#fbe3c6" stroke="#b5733a" stroke-width="1.5">
    <rect x="80" y="80" width="300" height="44" rx="6"/>
    <rect x="80" y="150" width="300" height="44" rx="6"/>
    <rect x="80" y="220" width="300" height="60" rx="6"/>
    <rect x="60" y="400" width="170" height="60" rx="6"/>
    <rect x="250" y="400" width="150" height="60" rx="6"/>
    <rect x="80" y="490" width="300" height="60" rx="6"/>
    <rect x="80" y="580" width="300" height="72" rx="6"/>
  </g>
  <polygon points="230,306 340,340 230,374 120,340" fill="#fff" stroke="#b5733a" stroke-width="1.5"/>
  <rect x="80" y="672" width="300" height="44" rx="6" fill="#fff" stroke="#b5733a" stroke-width="1.2" stroke-dasharray="5 3"/>

  <g font-size="12" fill="#222" text-anchor="middle">
    <text x="230" y="107" font-weight="bold">1. Wake in the cabin</text>
    <text x="230" y="177" font-weight="bold">2. Climb the tower to the lectern</text>
    <text x="230" y="242" font-weight="bold">3. Look at 5 locations, 2 s each</text>
    <text x="230" y="258" font-size="11">binoculars; the game stamps SAFE or CHECK</text>
    <text x="230" y="272" font-size="11">(cave never checked; day 1 all SAFE)</text>
    <text x="230" y="344" font-weight="bold">Any CHECK?</text>
    <text x="145" y="423" font-weight="bold">4a. Go there on foot</text>
    <text x="145" y="439" font-size="11">resolve it: Safety met</text>
    <text x="145" y="453" font-size="10">left open: the event's own cost</text>
    <text x="325" y="423" font-weight="bold">4b. All safe</text>
    <text x="325" y="439" font-size="11">Safety met</text>
    <text x="230" y="513" font-weight="bold">5. Chores and visits, any order</text>
    <text x="230" y="529" font-size="11">Food (store, forage, Camp 1 meal), Water (pump,</text>
    <text x="230" y="543" font-size="11">creek, barrel), Warmth (stove, Camp 3), Social (talk)</text>
    <text x="230" y="602" font-weight="bold">6. File the report from the logbook</text>
    <text x="230" y="618" font-size="11">anywhere: "Filing the report ends your day."</text>
    <text x="230" y="632" font-size="11">lists unmet needs; [Not yet] focused, [File]</text>
    <text x="230" y="646" font-size="10">locked until all 5 tower stamps are done</text>
    <text x="230" y="691" font-size="11" font-weight="bold">No time budget. An event can end the day:</text>
    <text x="230" y="706" font-size="10">a chase that catches you; you wake at the Ward (8)</text>
  </g>
  <g font-size="10" fill="#555">
    <text x="112" y="372">yes</text>
    <text x="335" y="372">no</text>
  </g>

  <!-- day arrows -->
  <g stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#arr)">
    <line x1="230" y1="124" x2="230" y2="148"/>
    <line x1="230" y1="194" x2="230" y2="218"/>
    <line x1="230" y1="280" x2="230" y2="304"/>
    <path d="M120,340 L145,340 L145,398"/>
    <path d="M340,340 L325,340 L325,398"/>
    <line x1="160" y1="460" x2="190" y2="488"/>
    <line x1="310" y1="460" x2="280" y2="488"/>
    <line x1="230" y1="550" x2="230" y2="578"/>
    <path d="M80,616 C40,604 40,532 78,520"/>
  </g>
  <text x="30" y="572" font-size="10" fill="#555">Not yet</text>

  <!-- File to night -->
  <path d="M380,616 H470 V105 H558" fill="none" stroke="#444" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="476" y="400" font-size="10" fill="#555" transform="rotate(-90 476 400)">File: day-end tone</text>

  <!-- night boxes -->
  <g fill="#2f3440" stroke="#1d2129" stroke-width="1.5">
    <rect x="560" y="80" width="340" height="50" rx="6"/>
    <rect x="560" y="272" width="160" height="66" rx="6"/>
    <rect x="740" y="272" width="160" height="66" rx="6"/>
    <rect x="560" y="370" width="340" height="92" rx="6"/>
    <rect x="560" y="488" width="340" height="72" rx="6"/>
  </g>
  <polygon points="730,166 830,200 730,234 630,200" fill="#fff" stroke="#2f3440" stroke-width="1.5"/>
  <polygon points="730,580 850,614 730,648 610,614" fill="#fff" stroke="#2f3440" stroke-width="1.5"/>
  <rect x="760" y="670" width="140" height="50" rx="6" fill="#7a1e08" stroke="#4a1204"/>

  <g font-size="12" fill="#fff" text-anchor="middle">
    <text x="730" y="101" font-weight="bold">7. Night falls. The J gate opens.</text>
    <text x="730" y="118" font-size="11">objective: Go to the Ward (3 s)</text>
    <text x="640" y="294" font-weight="bold">Walk to the Ward</text>
    <text x="640" y="310" font-size="11">the reveal: magic</text>
    <text x="640" y="325" font-size="11">and the wildfire</text>
    <text x="820" y="294" font-weight="bold">Walk to the Ward</text>
    <text x="820" y="310" font-size="11">or the bunk: Give nothing,</text>
    <text x="820" y="325" font-size="11">no screen, WARD falls by H</text>
    <text x="730" y="392" font-weight="bold">8. The Ward screen: stats shown here only</text>
    <text x="730" y="410" font-size="11">the Ward's hunger H is taken from WARD</text>
    <text x="730" y="425" font-size="11">(H = 1, rising by 1 every 7 days)</text>
    <text x="730" y="440" font-size="11">give 0 to 3 HP or MIND: +1 WARD each</text>
    <text x="730" y="455" font-size="10">0 is Give nothing: WARD falls by H</text>
    <text x="730" y="510" font-weight="bold">9. Sleep, autosave</text>
    <text x="730" y="527" font-size="11">unmet Food, Water, Warmth: -1 HP each</text>
    <text x="730" y="543" font-size="11">unmet Social, Safety: -1 MIND; open events: their own cost</text>
    <text x="830" y="692" font-weight="bold">Run ends</text>
    <text x="830" y="709" font-size="10">WARD 0: the world burns</text>
  </g>
  <g font-size="12" fill="#222" text-anchor="middle">
    <text x="730" y="204" font-weight="bold">Night 1?</text>
    <text x="730" y="618" font-weight="bold">HP, MIND or WARD at 0?</text>
  </g>
  <g font-size="10" fill="#555">
    <text x="600" y="254">yes: bunk locked</text>
    <text x="820" y="254">no</text>
    <text x="928" y="420" transform="rotate(90 928 420)">bunk</text>
    <text x="840" y="660">yes</text>
    <text x="545" y="605">no: next day</text>
  </g>

  <!-- night arrows -->
  <g stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#arr)">
    <line x1="730" y1="130" x2="730" y2="164"/>
    <path d="M630,200 L640,200 L640,270"/>
    <path d="M830,200 L820,200 L820,270"/>
    <line x1="640" y1="338" x2="680" y2="368"/>
    <line x1="820" y1="338" x2="780" y2="368"/>
    <path d="M900,305 H925 V520 H902" stroke-dasharray="5 3"/>
    <line x1="730" y1="462" x2="730" y2="486"/>
    <line x1="730" y1="560" x2="730" y2="578"/>
    <path d="M830,640 L830,668"/>
    <path d="M610,614 H500 V62 H230 V78"/>
    <path d="M380,694 H540 V416 H558" stroke-dasharray="5 3"/>
  </g>

  <!-- day 1 and events -->
  <rect x="60" y="740" width="410" height="64" rx="6" fill="#fff" stroke="#b5733a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="265" y="760" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a4f1c">Day 1 is Firewatch</text>
  <text x="265" y="777" text-anchor="middle" font-size="11" fill="#8a4f1c">all SAFE, no events, residents ordinary, no chant;</text>
  <text x="265" y="792" text-anchor="middle" font-size="11" fill="#8a4f1c">no fire visible at all until night 1 at the Ward</text>
  <rect x="490" y="740" width="410" height="64" rx="6" fill="#fff" stroke="#7b2d6b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="695" y="760" text-anchor="middle" font-size="12" font-weight="bold" fill="#7b2d6b">Events (Events.md) can break any step</text>
  <text x="695" y="777" text-anchor="middle" font-size="11" fill="#7b2d6b">flag, blind the tower, block or add a need, chase,</text>
  <text x="695" y="792" text-anchor="middle" font-size="11" fill="#7b2d6b">end the day, open a place, hijack the night, minigame</text>
</svg>
