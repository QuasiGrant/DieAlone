<text x="10" y="424" class="h">Walks (2.5 m/s; Marlow measures on the build)</text>
<text x="10" y="431" class="t">Gangway foot, east door, room, north doorway, step: 9.5 m, 4 s. Step to Stilts rest: 4 m, 2 s.</text>
<text x="10" y="437" class="t">Step to Reeds rest (out by the gangway, trail north): 19 m, 8 s. Straight line 6.4 m.</text>
<text x="10" y="443" class="t">Gangway foot to the gap (E-a) by the beach: 12 m, 5 s. To E-b 9 m; to E-c 10 m.</text>
<text x="10" y="449" class="t">Every gap here is under 0.6 or 1.0 and over: walkways 1.66, crate 0.51 and barrel 1.06 to the slip rail,</text>
