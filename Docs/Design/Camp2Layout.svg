 .keep{fill:none;stroke:#3d5a2a;stroke-width:0.4;stroke-dasharray:1 1}
 .frame{fill:none;stroke:#999;stroke-width:0.3}
 .warp{fill:#2a7fd4;stroke:#123;stroke-width:0.3}
</style>
<rect x="0" y="0" width="680" height="600" fill="#fff"/>
<text class="h" x="20" y="14">Camp2Layout.svg, draft 1, 2026-10-02, Sable. Plans: north up, world metres. Section: looking west. Nothing decided until DECISIONS.md.</text>

