<rect x="0" y="0" width="594" height="420" fill="#fff"/>
<text x="8" y="12" class="h">FrontLayout.svg, DRAFT 1, 2026-10-02, Sable (PLAN 8.22). Office and store level 1:50, booth 1:50 and section 1:100, zone 1:500. FrontLayout.md wins for numbers.</text>
<text x="8" y="19" class="t">Orange = interaction point. Red solid = IW1 (always). Red dashed = IW3 (shift only). Blue = walked route. Purple dashed = sightline to prove. Green hatched = brush band stops. Dashed grey = clear zone or overhead.</text>

