    <rect x="600" y="960" width="40" height="12" fill="url(#fire)"/><text x="646" y="970">fire direction (west)</text>

    <text x="60" y="990" fill="#444">Camp to the Ward at night: 226 m, 90 s. Camp to the office: 307 m. Giant tops at most 50 m absolute (42 m tall on the knoll).</text>
