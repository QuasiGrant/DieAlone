    <text x="524" y="532">80 m / 32 s</text>
    <text x="630" y="596">84 m / 34 s</text>
    <text x="752" y="664">95 m / 38 s</text>
    <text x="862" y="500" text-anchor="end">98 m / 39 s</text>
    <text x="600" y="362">125 m / 50 s</text>
    <text x="822" y="446" text-anchor="middle">116 m / 46 s</text>
    <text x="740" y="320">83 m / 33 s, dead end</text>
    <text x="360" y="452" text-anchor="end">126 m / 50 s</text>
    <text x="455" y="624" text-anchor="middle">80 m / 32 s</text>
    <text x="318" y="572" text-anchor="end">114 m / 46 s</text>
    <text x="300" y="716" text-anchor="middle">109 m / 44 s, dead end</text>
    <text x="415" y="316">96 m / 38 s</text>
  </g>
  <g font-size="10" font-weight="bold" fill="#7b2d6b" style="paint-order:stroke;stroke:#f6f3ec;stroke-width:3px">
    <text x="345" y="236">Ward climb 130 m / 52 s</text>
    <text x="345" y="249">night only</text>
  </g>

  <!-- place labels -->
