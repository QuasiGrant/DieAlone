<rect x="0" y="0" width="594" height="420" fill="#fff"/>
<text x="10" y="14" class="h">CampLayout.svg, DRAFT 1, 2026-10-02, Sable (PLAN 8.21). Keeper's camp: cabin plan and section 1:50, camp 1:500. Doc: CampLayout.md wins for numbers.</text>
<text x="10" y="21" class="t">Cabin local metres: origin inside south-west corner = world (175, 165.75), X east, Z north. Orange = interaction point (Pim). Blue band = the 1 m clear path. Dashed = above head, beyond the cut, or clear zone.</text>

